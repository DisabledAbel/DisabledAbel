name: Update Merged Contributed Repos

on:
  schedule:
    - cron: "0 23 * * 5" # Every Friday at 11 PM
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-merged-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get merged contributed repositories
        uses: actions/github-script@v7
        env:
          PROFILE_USERNAME: DisabledAbel
        with:
          script: |
            const fs = require('fs');
            const username = process.env.PROFILE_USERNAME || context.repo.owner;
            const query = `
              query($login: String!) {
                user(login: $login) {
                  pullRequests(first: 100, states: MERGED) {
                    nodes {
                      repository {
                        nameWithOwner
                        url
                        owner {
                          login
                        }
                      }
                    }
                  }
                }
              }
            `;
            const response = await github.graphql(query, { login: username });
            const pullRequests = response.user?.pullRequests?.nodes || [];

            const repoMap = new Map();
            for (const pr of pullRequests) {
              const repo = pr.repository;
              if (repo.owner.login !== username) {
                repoMap.set(repo.nameWithOwner, repo.url);
              }
            }

            const repos = [...repoMap.entries()]
              .sort((a, b) => a[0].localeCompare(b[0]))
              .map(([name, url]) => `- [\`${name}\`](${url})`);

            const startMarker = '<!-- merged-repos:start -->';
            const endMarker = '<!-- merged-repos:end -->';
            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');

            if (!readme.includes(startMarker) || !readme.includes(endMarker)) {
              core.setFailed(`README is missing ${startMarker}/${endMarker} markers.`);
              return;
            }

            const body = repos.length
              ? repos.join('\n')
              : '- No merged public contributions found (yet ✨)';

            const updated = readme.replace(
              new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`, 'm'),
              `${startMarker}\n${body}\n${endMarker}`
            );

            fs.writeFileSync(readmePath, updated);
            core.info(`Updated merged repo list with ${repos.length} repositories.`);

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update merged contributed repos"
          file_pattern: README.md
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
